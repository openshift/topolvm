contentOrigin:
  # DNF repos needed to resolve the packages. Self-contained (no external
  # redhat.repo required): the entitlement cert/key are injected by DNF via the
  # $SSL_CLIENT_CERT / $SSL_CLIENT_KEY variables (see hack/generate-rpm-lock.sh).
  repos:
    # RHEL 9.2 E4S (Update Services) repos, matching the rhel9-2-els base image
    # pinned in konflux.Dockerfile (its CPE is cpe:/a:redhat:rhel_e4s:9.2). The
    # minor version is hardcoded on purpose: the base image is a 9.2 image and
    # must never resolve against GA repos of a later minor (which is what
    # $releasever would select).
    - repoid: rhel-9-for-$basearch-baseos-e4s-rpms
      name: Red Hat Enterprise Linux 9 for $basearch - BaseOS - Update Services (RPMs)
      baseurl: https://cdn.redhat.com/content/e4s/rhel9/9.2/$basearch/baseos/os
      enabled: "1"
      gpgcheck: "1"
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      sslverify: "1"
      sslverifystatus: "1"
      metadata_expire: "86400"
      enabled_metadata: "1"
      sslcacert: /etc/rhsm/ca/redhat-uep.pem
      sslclientkey: $SSL_CLIENT_KEY
      sslclientcert: $SSL_CLIENT_CERT

    - repoid: rhel-9-for-$basearch-baseos-e4s-source-rpms
      name: Red Hat Enterprise Linux 9 for $basearch - BaseOS - Update Services (Source RPMs)
      baseurl: https://cdn.redhat.com/content/e4s/rhel9/9.2/$basearch/baseos/source/SRPMS
      enabled: "1"
      gpgcheck: "1"
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      sslverify: "1"
      metadata_expire: "86400"
      enabled_metadata: "0"
      sslcacert: /etc/rhsm/ca/redhat-uep.pem
      sslclientkey: $SSL_CLIENT_KEY
      sslclientcert: $SSL_CLIENT_CERT

    - repoid: rhel-9-for-$basearch-appstream-e4s-rpms
      name: Red Hat Enterprise Linux 9 for $basearch - AppStream - Update Services (RPMs)
      baseurl: https://cdn.redhat.com/content/e4s/rhel9/9.2/$basearch/appstream/os
      enabled: "1"
      gpgcheck: "1"
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      sslverify: "1"
      sslverifystatus: "1"
      metadata_expire: "86400"
      enabled_metadata: "1"
      sslcacert: /etc/rhsm/ca/redhat-uep.pem
      sslclientkey: $SSL_CLIENT_KEY
      sslclientcert: $SSL_CLIENT_CERT

    - repoid: rhel-9-for-$basearch-appstream-e4s-source-rpms
      name: Red Hat Enterprise Linux 9 for $basearch - AppStream - Update Services (Source RPMs)
      baseurl: https://cdn.redhat.com/content/e4s/rhel9/9.2/$basearch/appstream/source/SRPMS
      enabled: "1"
      gpgcheck: "1"
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      sslverify: "1"
      metadata_expire: "86400"
      enabled_metadata: "0"
      sslcacert: /etc/rhsm/ca/redhat-uep.pem
      sslclientkey: $SSL_CLIENT_KEY
      sslclientcert: $SSL_CLIENT_CERT

packages:
  # list of rpm names to resolve
  - util-linux
  - xfsprogs
  - e2fsprogs

upgradePackages:
  # list of rpms already provided in the base image, but which should be upgraded
  - glibc

arches:
  # The list of architectures can be set in the config file. Any `--arch` option set
  # on the command line will override this list.
  - aarch64
  - x86_64
  - s390x
  - ppc64le

context:
  # Alternative to setting command line options. Usually you will only want
  # to include one of these options, with the exception of `flatpak` that
  # can be combined with `image` and `containerfile`
  containerfile:
    file: konflux.Dockerfile
    imagePattern: registry.redhat.io/rhel9-2-els/rhel

# Tell DNF it may erase already installed packages when resolving the
# transaction. Defaults to false.
allowerasing: true
